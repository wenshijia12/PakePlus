<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KK德州酒馆 · 荣誉排行榜</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5efe6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background-image:
                radial-gradient(ellipse at 15% 20%, rgba(255, 215, 0, 0.08) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 80%, rgba(255, 180, 50, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 200, 100, 0.04) 0%, transparent 65%);
            transition: all 0.3s ease;
        }

        /* ===== 主容器 ===== */
        .dashboard {
            max-width: 1480px;
            width: 100%;
            background: linear-gradient(160deg, #fffcf5, #f8f0e6);
            border-radius: 56px 56px 40px 40px;
            padding: 40px 48px 32px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.08),
                0 0 0 1px rgba(200, 170, 100, 0.12),
                inset 0 0 80px rgba(255, 215, 0, 0.03);
            border: 1px solid rgba(200, 170, 100, 0.15);
            position: relative;
            overflow: hidden;
        }

        /* 柔和光晕装饰 */
        .dashboard::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(ellipse, rgba(255, 215, 0, 0.06) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        .dashboard::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(ellipse, rgba(255, 180, 50, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .dashboard>* {
            position: relative;
            z-index: 1;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding-bottom: 18px;
            border-bottom: 2px solid rgba(200, 170, 100, 0.12);
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .header-icon {
            font-size: 44px;
            line-height: 1;
            filter: drop-shadow(0 0 12px rgba(212, 167, 74, 0.15));
        }

        .header-title h1 {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #c49a38, #d4a74a, #e8c86a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            text-shadow: 0 2px 20px rgba(212, 167, 74, 0.08);
        }

        .header-title .sub {
            font-size: 16px;
            color: rgba(160, 130, 80, 0.60);
            letter-spacing: 10px;
            font-weight: 300;
            margin-top: 2px;
            -webkit-text-fill-color: rgba(160, 130, 80, 0.60);
            background: none;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .header-stats {
            display: flex;
            gap: 24px;
            background: rgba(255, 215, 0, 0.06);
            padding: 6px 24px 6px 28px;
            border-radius: 40px;
            border: 1px solid rgba(200, 170, 100, 0.10);
            backdrop-filter: blur(4px);
        }

        .stat-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
            color: rgba(120, 100, 70, 0.70);
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .stat-item .stat-icon {
            font-size: 16px;
        }

        .stat-item span:last-child {
            font-size: 22px;
            font-weight: 700;
            color: #b8912e;
            min-width: 30px;
            text-align: center;
        }

        .stat-item.highlight-gold span:last-child {
            color: #c49a38;
            text-shadow: 0 0 30px rgba(196, 154, 56, 0.15);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-ctrl {
            background: rgba(200, 170, 100, 0.06);
            border: 1px solid rgba(200, 170, 100, 0.10);
            color: rgba(120, 100, 70, 0.70);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-ctrl:hover {
            background: rgba(200, 170, 100, 0.12);
            border-color: rgba(200, 170, 100, 0.20);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(200, 160, 80, 0.06);
        }
        .btn-ctrl.active {
            background: rgba(200, 170, 100, 0.12);
            border-color: rgba(200, 170, 100, 0.20);
            color: #b8912e;
            box-shadow: 0 0 30px rgba(200, 160, 80, 0.06);
        }

        .btn-ctrl .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #a0b0a0;
            transition: all 0.3s ease;
        }
        .btn-ctrl.active .dot {
            background: #c49a38;
            box-shadow: 0 0 16px rgba(196, 154, 56, 0.4);
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        .btn-bigscreen {
            background: linear-gradient(135deg, rgba(200, 170, 100, 0.06), rgba(212, 167, 74, 0.05));
            border: 1px solid rgba(200, 170, 100, 0.10);
            color: rgba(120, 100, 70, 0.75);
            padding: 8px 22px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .btn-bigscreen:hover {
            background: rgba(200, 170, 100, 0.14);
            border-color: rgba(200, 170, 100, 0.20);
            transform: translateY(-1px);
            box-shadow: 0 6px 30px rgba(200, 160, 80, 0.08);
        }

        /* ===== 滚动容器 ===== */
        .scroll-wrapper {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(200, 170, 100, 0.08);
            background: rgba(255, 248, 240, 0.50);
            box-shadow: inset 0 0 40px rgba(200, 170, 100, 0.04);
            margin-bottom: 24px;
            height: 460px;
        }

        .scroll-viewport {
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .scroll-content {
            transition: transform 0.7s cubic-bezier(0.34, 1.0, 0.64, 1);
            will-change: transform;
        }

        /* ===== 排行榜表格 ===== */
        .rank-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 17px;
        }

        .rank-table thead {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.10), rgba(255, 200, 100, 0.06));
            border-bottom: 2px solid rgba(200, 170, 100, 0.12);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(12px);
        }

        .rank-table thead th {
            padding: 16px 20px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 3px;
            color: rgba(140, 120, 80, 0.65);
            text-transform: uppercase;
            border-bottom: 1px solid rgba(200, 170, 100, 0.06);
        }

        .rank-table thead th:first-child {
            padding-left: 32px;
            width: 80px;
        }
        .rank-table thead th:nth-child(2) {
            width: 120px;
            text-align: center;
        }
        .rank-table thead th:nth-child(3) {
            width: auto;
            text-align: left;
        }
        .rank-table thead th:nth-child(4) {
            width: 130px;
            text-align: right;
            padding-right: 32px;
        }
        .rank-table thead th:last-child {
            width: 170px;
            text-align: center;
        }

        .rank-table tbody tr {
            border-bottom: 1px solid rgba(200, 170, 100, 0.05);
            transition: background 0.3s ease;
        }

        .rank-table tbody tr:nth-child(odd) {
            background: rgba(255, 248, 240, 0.30);
        }
        .rank-table tbody tr:nth-child(even) {
            background: rgba(255, 215, 0, 0.03);
        }

        .rank-table tbody tr:hover {
            background: rgba(255, 215, 0, 0.08);
        }

        .rank-table tbody tr:last-child {
            border-bottom: none;
        }

        .rank-table tbody td {
            padding: 14px 20px;
            vertical-align: middle;
            color: #4a3f30;
        }

        .rank-table tbody td:first-child {
            padding-left: 32px;
            font-weight: 700;
            font-size: 22px;
            color: rgba(140, 120, 90, 0.60);
        }

        .rank-table tbody td:nth-child(2) {
            text-align: center;
            font-size: 16px;
            font-weight: 500;
            color: rgba(100, 130, 160, 0.75);
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
            background: rgba(100, 150, 200, 0.04);
            border-radius: 4px;
        }

        .rank-table tbody td:nth-child(3) {
            font-size: 19px;
            font-weight: 600;
            color: #3a3228;
            letter-spacing: 0.5px;
            padding-left: 12px;
        }

        .rank-table tbody td:nth-child(4) {
            text-align: right;
            padding-right: 32px;
            font-size: 26px;
            font-weight: 700;
            color: #b8912e;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }

        .rank-table tbody td:last-child {
            text-align: center;
        }

        /* ===== 排名特殊样式 ===== */
        .rank-1 td:first-child {
            color: #c49a38 !important;
            font-size: 32px !important;
            text-shadow: 0 0 30px rgba(196, 154, 56, 0.20);
        }
        .rank-2 td:first-child {
            color: #a8a8a8 !important;
            font-size: 30px !important;
            text-shadow: 0 0 20px rgba(168, 168, 168, 0.15);
        }
        .rank-3 td:first-child {
            color: #c49a6a !important;
            font-size: 30px !important;
            text-shadow: 0 0 20px rgba(196, 154, 106, 0.15);
        }

        .rank-1 {
            background: rgba(255, 215, 0, 0.08) !important;
            border-left: 4px solid #c49a38;
            box-shadow: inset 0 0 40px rgba(255, 215, 0, 0.03);
        }
        .rank-2 {
            background: rgba(200, 200, 200, 0.05) !important;
            border-left: 4px solid #a8a8a8;
        }
        .rank-3 {
            background: rgba(205, 160, 120, 0.05) !important;
            border-left: 4px solid #c49a6a;
        }

        .rank-1 td:nth-child(3) {
            color: #c49a38 !important;
        }
        .rank-2 td:nth-child(3) {
            color: #888888 !important;
        }
        .rank-3 td:nth-child(3) {
            color: #b08868 !important;
        }
        .rank-1 td:nth-child(4) {
            color: #c49a38 !important;
            text-shadow: 0 0 30px rgba(196, 154, 56, 0.12);
        }
        .rank-2 td:nth-child(4) {
            color: #999999 !important;
        }
        .rank-3 td:nth-child(4) {
            color: #b08868 !important;
        }

        .rank-1 td:nth-child(2) {
            color: #c49a38 !important;
            background: rgba(196, 154, 56, 0.08);
        }
        .rank-2 td:nth-child(2) {
            color: #999999 !important;
            background: rgba(150, 150, 150, 0.05);
        }
        .rank-3 td:nth-child(2) {
            color: #b08868 !important;
            background: rgba(176, 136, 104, 0.05);
        }

        .medal {
            font-size: 32px;
            display: inline-block;
            width: 46px;
            text-align: center;
            filter: drop-shadow(0 0 8px rgba(196, 154, 56, 0.10));
        }

        /* ===== 操作按钮 ===== */
        .action-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 18px;
            border: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            background: rgba(200, 170, 100, 0.04);
            color: rgba(120, 100, 70, 0.65);
            border: 1px solid rgba(200, 170, 100, 0.08);
            letter-spacing: 0.5px;
            min-width: 58px;
            backdrop-filter: blur(4px);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        .btn-edit {
            color: #5a8ab0;
            border-color: rgba(90, 138, 176, 0.15);
            background: rgba(90, 138, 176, 0.04);
        }
        .btn-edit:hover {
            background: rgba(90, 138, 176, 0.12);
            border-color: rgba(90, 138, 176, 0.25);
            box-shadow: 0 0 30px rgba(90, 138, 176, 0.06);
        }

        .btn-delete {
            color: #c07070;
            border-color: rgba(192, 112, 112, 0.12);
            background: rgba(192, 112, 112, 0.03);
        }
        .btn-delete:hover {
            background: rgba(192, 112, 112, 0.12);
            border-color: rgba(192, 112, 112, 0.20);
            box-shadow: 0 0 30px rgba(192, 112, 112, 0.05);
        }

        .btn-add {
            background: linear-gradient(135deg, #d4a74a, #b8912e);
            color: #fffcf5;
            font-size: 16px;
            padding: 10px 34px;
            border: none;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 4px 30px rgba(200, 160, 80, 0.15);
            min-width: auto;
        }
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 44px rgba(200, 160, 80, 0.25);
            background: linear-gradient(135deg, #e0bc5a, #c49a38);
        }
        .btn-add:active {
            transform: translateY(0px);
        }

        .btn-cancel {
            background: rgba(200, 170, 100, 0.04);
            color: rgba(120, 100, 70, 0.55);
            border-color: rgba(200, 170, 100, 0.08);
        }
        .btn-cancel:hover {
            background: rgba(200, 170, 100, 0.08);
        }

        .btn-save {
            background: linear-gradient(135deg, #7aaa7a, #5a8a5a);
            color: #fffcf5;
            border: none;
            box-shadow: 0 4px 24px rgba(90, 138, 90, 0.20);
        }
        .btn-save:hover {
            background: linear-gradient(135deg, #8aba8a, #6a9a6a);
            box-shadow: 0 6px 32px rgba(90, 138, 90, 0.30);
        }

        /* ===== 底部：添加区域 ===== */
        .footer-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 20px;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 215, 0, 0.03);
            padding: 14px 22px 16px;
            border-radius: 20px;
            border: 1px solid rgba(200, 170, 100, 0.06);
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.02), rgba(255, 200, 100, 0.02));
        }

        .add-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            align-items: center;
            flex: 1;
        }

        .add-form .field-group {
            display: flex;
            align-items: center;
            gap: 4px 10px;
            flex-wrap: wrap;
            flex: 0 1 auto;
        }

        .add-form label {
            font-size: 14px;
            color: rgba(120, 100, 70, 0.65);
            font-weight: 400;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .add-form label .label-icon {
            margin-right: 3px;
        }

        .add-form input {
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(200, 170, 100, 0.10);
            background: rgba(255, 248, 240, 0.60);
            color: #3a3228;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
            width: 130px;
            backdrop-filter: blur(4px);
        }

        .add-form input:focus {
            border-color: rgba(200, 170, 100, 0.30);
            background: rgba(255, 248, 240, 0.80);
            box-shadow: 0 0 30px rgba(200, 160, 80, 0.04), inset 0 0 20px rgba(200, 160, 80, 0.02);
        }

        .add-form input::placeholder {
            color: rgba(160, 140, 110, 0.30);
            font-weight: 300;
        }

        .add-form input.input-id {
            width: 110px;
            border-color: rgba(100, 150, 200, 0.12);
            font-family: 'Courier New', monospace;
        }
        .add-form input.input-id:focus {
            border-color: rgba(100, 150, 200, 0.25);
        }

        .add-form input.input-name {
            width: 130px;
        }
        .add-form input.input-score {
            width: 100px;
        }

        .add-form .input-hint {
            font-size: 11px;
            color: rgba(160, 140, 110, 0.25);
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .footer-hint {
            color: rgba(160, 140, 110, 0.25);
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.30);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: linear-gradient(150deg, #fffcf5, #f8f0e6);
            border-radius: 36px;
            padding: 36px 44px 32px;
            max-width: 480px;
            width: 92%;
            border: 1px solid rgba(200, 170, 100, 0.12);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.12);
            transform: scale(0.92) translateY(20px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1) translateY(0);
        }

        .modal-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #c49a38, #d4a74a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-sub {
            font-size: 14px;
            color: rgba(120, 100, 70, 0.50);
            margin-bottom: 24px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .modal-field {
            margin-bottom: 18px;
        }

        .modal-field label {
            display: block;
            font-size: 13px;
            color: rgba(120, 100, 70, 0.60);
            margin-bottom: 5px;
            letter-spacing: 1px;
            font-weight: 400;
        }

        .modal-field label .field-icon {
            margin-right: 4px;
        }

        .modal-field input {
            width: 100%;
            padding: 11px 18px;
            border-radius: 14px;
            border: 1px solid rgba(200, 170, 100, 0.10);
            background: rgba(255, 248, 240, 0.60);
            color: #3a3228;
            font-size: 18px;
            font-weight: 500;
            outline: none;
            transition: all 0.3s ease;
        }

        .modal-field input:focus {
            border-color: rgba(200, 170, 100, 0.25);
            background: rgba(255, 248, 240, 0.80);
            box-shadow: 0 0 30px rgba(200, 160, 80, 0.04);
        }

        .modal-field input.field-id {
            border-color: rgba(100, 150, 200, 0.10);
            font-family: 'Courier New', monospace;
        }
        .modal-field input.field-id:focus {
            border-color: rgba(100, 150, 200, 0.20);
        }

        .modal-field input.field-name {
            border-color: rgba(200, 170, 100, 0.08);
        }
        .modal-field input.field-name:focus {
            border-color: rgba(200, 170, 100, 0.20);
        }

        .modal-field input.field-score {
            border-color: rgba(200, 170, 100, 0.08);
            font-size: 22px;
            font-weight: 700;
        }
        .modal-field input.field-score:focus {
            border-color: rgba(200, 170, 100, 0.20);
        }

        .modal-actions {
            display: flex;
            gap: 14px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .modal-actions .btn {
            padding: 10px 34px;
            font-size: 16px;
            min-width: 100px;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 44px 20px 40px;
            color: rgba(160, 140, 110, 0.25);
        }

        .empty-state .empty-icon {
            font-size: 52px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* ===== 滚动条 ===== */
        .scroll-wrapper::-webkit-scrollbar {
            width: 4px;
        }
        .scroll-wrapper::-webkit-scrollbar-track {
            background: rgba(200, 170, 100, 0.04);
        }
        .scroll-wrapper::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, rgba(200, 170, 100, 0.20), rgba(100, 150, 200, 0.20));
            border-radius: 10px;
        }

        /* ================================================================
           大屏展示模式
           ================================================================ */
        .big-screen-mode .header-stats,

    <script>
        // ================================================================
        //  DATA
        // ================================================================
        const STORAGE_KEY = 'kk_tavern_rankings';
        let players = [];
        let editingIndex = null;

        // ================================================================
        //  DOM refs
        // ================================================================
        const tbody = document.getElementById('tableBody');
        const totalEl = document.getElementById('totalPlayers');
        const maxEl = document.getElementById('maxScore');
        const scrollWrapper = document.getElementById('scrollWrapper');
        const scrollViewport = document.getElementById('scrollViewport');
        const scrollContent = document.getElementById('scrollContent');

        const inputId = document.getElementById('inputId');
        const inputName = document.getElementById('inputName');
        const inputScore = document.getElementById('inputScore');
        const btnAdd = document.getElementById('btnAdd');

        const modalOverlay = document.getElementById('modalOverlay');
        const modalId = document.getElementById('modalId');
        const modalName = document.getElementById('modalName');
        const modalScore = document.getElementById('modalScore');
        const modalCancel = document.getElementById('modalCancel');
        const modalSave = document.getElementById('modalSave');

        const bigScreenBtn = document.getElementById('toggleBigScreen');
        const btnScrollToggle = document.getElementById('btnScrollToggle');

        // ================================================================
        //  滚屏控制
        // ================================================================
        let scrollTimer = null;
        let isScrolling = true;
        let currentScrollRow = 0;
        let scrollPaused = false;

        function getRowHeight() {
            const firstRow = document.querySelector('.rank-table tbody tr');
            if (!firstRow) return 0;
            return firstRow.offsetHeight;
        }

        function getHeaderHeight() {
            const header = document.querySelector('.rank-table thead');
            if (!header) return 0;
            return header.offsetHeight;
        }

        function getVisibleRows() {
            const viewportHeight = scrollViewport.clientHeight;
            const h = getHeaderHeight();
            const rh = getRowHeight();
            if (rh === 0) return 0;
            return Math.floor((viewportHeight - h) / rh);
        }

        function getTotalRows() {
            return players.length;
        }

        function getScrollContentHeight() {
            const headerH = getHeaderHeight();
            const rh = getRowHeight();
            const total = getTotalRows();
            return headerH + total * rh;
        }

        function updateScrollHeight() {
            const contentHeight = getScrollContentHeight();
            scrollContent.style.height = contentHeight + 'px';
        }

        function scrollToRow(index) {
            const rh = getRowHeight();
            const headerH = getHeaderHeight();
            const total = getTotalRows();
            const visible = getVisibleRows();

            if (rh === 0 || total === 0) return;

            const maxIndex = Math.max(0, total - visible);
            const safeIndex = Math.min(Math.max(0, index), maxIndex);

            const scrollY = headerH + safeIndex * rh;
            scrollContent.style.transform = `translateY(-${scrollY}px)`;
            currentScrollRow = safeIndex;
        }

        function startScroll() {
            stopScroll();
            const total = getTotalRows();
            const visible = getVisibleRows();

            if (total <= visible || total <= 1) {
                isScrolling = false;
                updateScrollBtnState();
                return;
            }

            isScrolling = true;
            updateScrollBtnState();

            currentScrollRow = 0;
            scrollToRow(0);

            scrollTimer = setInterval(() => {
                if (scrollPaused) return;

                const totalRowsNow = getTotalRows();
                const visibleNow = getVisibleRows();

                if (totalRowsNow <= visibleNow || totalRowsNow <= 1) {
                    stopScroll();
                    return;
                }

                const maxIndex = Math.max(0, totalRowsNow - visibleNow);
                let nextRow = currentScrollRow + 1;

                if (nextRow > maxIndex) {
                    nextRow = 0;
                }

                scrollToRow(nextRow);
            }, 3500);
        }

        function stopScroll() {
            if (scrollTimer) {
                clearInterval(scrollTimer);
                scrollTimer = null;
            }
            isScrolling = false;
            updateScrollBtnState();
        }

        function toggleScroll() {
            if (isScrolling) {
                stopScroll();
            } else {
                startScroll();
            }
        }

        function updateScrollBtnState() {
            if (isScrolling) {
                btnScrollToggle.classList.add('active');
                btnScrollToggle.innerHTML = '<span class="dot"></span> 滚屏';
            } else {
                btnScrollToggle.classList.remove('active');
                btnScrollToggle.innerHTML = '⏸ 暂停';
            }
        }

        scrollWrapper.addEventListener('mouseenter', () => {
            scrollPaused = true;
        });
        scrollWrapper.addEventListener('mouseleave', () => {
            scrollPaused = false;
        });

        btnScrollToggle.addEventListener('click', toggleScroll);

        // ================================================================
        //  HELPERS
        // ================================================================
        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length) {
                        players = parsed;
                        return;
                    }
                }
            } catch (_) { /* ignore */ }
            players = [
                { id: 'P1001', name: '德州之虎', score: 2850 },
                { id: 'P1002', name: '金手镯', score: 2420 },
                { id: 'P1003', name: '河牌杀手', score: 2100 },
                { id: 'P1004', name: '盲注猎人', score: 1860 },
                { id: 'P1005', name: '同花顺', score: 1520 },
                { id: 'P1006', name: '葫芦王', score: 1280 },
                { id: 'P1007', name: '皇家同花顺', score: 980 },
                { id: 'P1008', name: '四条猎人', score: 760 },
            ];
            saveData();
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(players));
        }

        function generateId() {
            const ts = Date.now().toString().slice(-6);
            const rand = Math.floor(Math.random() * 100).toString().padStart(2, '0');
            return 'P' + ts + rand;
        }

        function isIdUnique(id, excludeIndex) {
            return !players.some((p, idx) => p.id === id && idx !== excludeIndex);
        }

        function cleanId(id) {
            return id.trim();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ================================================================
        //  CORE: sort & render
        // ================================================================
        function sortPlayers() {
            players.sort((a, b) => b.score - a.score);
        }

        function render() {
            sortPlayers();
            const total = players.length;

            totalEl.textContent = total;
            if (total === 0) {
                maxEl.textContent = '—';
            } else {
                const scores = players.map(p => p.score);
                maxEl.textContent = Math.max(...scores);
            }

            if (total === 0) {
                tbody.innerHTML = `
                        <tr><td colspan="5">
                            <div class="empty-state">
                                <div class="empty-icon">🃏</div>
                                <p>酒馆空无一人 · 快来录入第一位勇士</p>
                            </div>
                        </td></tr>
                    `;
                stopScroll();
                return;
            }

            let html = '';
            const medals = ['🥇', '🥈', '🥉'];
            for (let i = 0; i < players.length; i++) {
                const p = players[i];
                const rank = i + 1;
                let rankDisplay = rank;
                let rowClass = '';
                if (rank === 1) { rankDisplay = medals[0];
                    rowClass = 'rank-1'; } else if (rank === 2) { rankDisplay = medals[1];
                    rowClass = 'rank-2'; } else if (rank === 3) { rankDisplay = medals[2];
                    rowClass = 'rank-3'; }

                html += `
                        <tr class="${rowClass}" data-index="${i}">
                            <td><span class="medal">${rankDisplay}</span></td>
                            <td>${escapeHtml(p.id || '')}</td>
                            <td>${escapeHtml(p.name)}</td>
                            <td>${p.score}</td>
                            <td>
                                <div class="action-group">
                                    <button class="btn btn-edit" data-index="${i}" data-action="edit">✎ 编辑</button>
                                    <button class="btn btn-delete" data-index="${i}" data-action="delete">✕ 删除</button>
                                </div>
                            </td>
                        </tr>
                    `;
            }
            tbody.innerHTML = html;

            setTimeout(() => {
                updateScrollHeight();
                currentScrollRow = 0;
                scrollToRow(0);

                const totalNow = getTotalRows();
                const visibleNow = getVisibleRows();
                if (totalNow > visibleNow && totalNow > 1) {
                    if (isScrolling) {
                        startScroll();
                    }
                } else {
                    stopScroll();
                }
            }, 50);
        }

        // ================================================================
        //  CRUD
        // ================================================================
        function addPlayer(id, name, score) {
            const trimmedId = cleanId(id);
            const trimmedName = name.trim();

            if (!trimmedName) { alert('请输入玩家姓名'); return false; }
            if (isNaN(score) || score < 0) { alert('请输入有效的积分（≥ 0）'); return false; }

            let finalId = trimmedId;
            if (!finalId) {
                finalId = generateId();
            } else {
                if (!isIdUnique(finalId, -1)) {
                    alert(`ID "${finalId}" 已被其他玩家使用，请换一个。`);
                    return false;
                }
                if (!/^[a-zA-Z0-9_-]+$/.test(finalId)) {
                    alert('ID只能包含字母、数字、下划线和短横线');
                    return false;
                }
            }

            const dup = players.find(p => p.name.toLowerCase() === trimmedName.toLowerCase());
            if (dup) {
                if (!confirm(`已有玩家 "${dup.name}" (ID: ${dup.id})，是否继续添加？`)) {
                    return false;
                }
            }

            players.push({
                id: finalId,
                name: trimmedName,
                score: Math.round(score),
            });
            saveData();
            render();
            return true;
        }

        function deletePlayer(index) {
            if (index < 0 || index >= players.length) return;
            const name = players[index].name;
            if (!confirm(`确定要删除玩家 "${name}" 吗？`)) return;
            players.splice(index, 1);
            saveData();
            render();
        }

        function editPlayer(index, newId, newName, newScore) {
            if (index < 0 || index >= players.length) return false;

            const trimmedId = cleanId(newId);
            const trimmedName = newName.trim();

            if (!trimmedName) { alert('请输入玩家姓名'); return false; }
            if (isNaN(newScore) || newScore < 0) { alert('请输入有效的积分（≥ 0）'); return false; }
            if (!trimmedId) { alert('ID不能为空'); return false; }
            if (!/^[a-zA-Z0-9_-]+$/.test(trimmedId)) {
                alert('ID只能包含字母、数字、下划线和短横线');
                return false;
            }

            const oldId = players[index].id;
            if (trimmedId !== oldId && !isIdUnique(trimmedId, index)) {
                alert(`ID "${trimmedId}" 已被其他玩家使用，请换一个。`);
                return false;
            }

            players[index].id = trimmedId;
            players[index].name = trimmedName;
            players[index].score = Math.round(newScore);
            saveData();
            render();
            return true;
        }

        // ================================================================
        //  MODAL
        // ================================================================
        function openModal(index) {
            if (index < 0 || index >= players.length) return;
            editingIndex = index;
            modalId.value = players[index].id || '';
            modalName.value = players[index].name;
            modalScore.value = players[index].score;
            modalOverlay.classList.add('active');
            scrollPaused = true;
            setTimeout(() => modalId.focus(), 150);
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            editingIndex = null;
            scrollPaused = false;
        }

        function handleModalSave() {
            if (editingIndex === null || editingIndex < 0 || editingIndex >= players.length) return;
            const idVal = modalId.value.trim();
            const nameVal = modalName.value.trim();
            const scoreVal = parseFloat(modalScore.value);

            if (!idVal) { alert('ID不能为空');
                modalId.focus(); return; }
            if (!nameVal) { alert('请输入玩家姓名');
                modalName.focus(); return; }
            if (isNaN(scoreVal) || scoreVal < 0) { alert('请输入有效的积分（≥ 0）');
                modalScore.focus(); return; }

            const success = editPlayer(editingIndex, idVal, nameVal, scoreVal);
            if (success) {
                closeModal();
            }
        }

        // ================================================================
        //  BIG SCREEN MODE
        // ================================================================
        function toggleBigScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.warn('全屏请求被拒绝', err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                document.body.classList.add('big-screen-mode');
                bigScreenBtn.textContent = '⏹ 退出';
                if (!isScrolling) {
                    startScroll();
                }
                setTimeout(() => {
                    updateScrollHeight();
                    scrollToRow(currentScrollRow);
                }, 300);
            } else {
                document.body.classList.remove('big-screen-mode');
                bigScreenBtn.textContent = '🖥 大屏';
            }
        });

        bigScreenBtn.addEventListener('click', toggleBigScreen);

        // ================================================================
        //  EVENTS
        // ================================================================
        tbody.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const action = btn.dataset.action;
            const index = parseInt(btn.dataset.index);
            if (isNaN(index)) return;

            if (action === 'edit') {
                openModal(index);
            } else if (action === 'delete') {
                deletePlayer(index);
            }
        });

        btnAdd.addEventListener('click', () => {
            const idVal = inputId.value.trim();
            const nameVal = inputName.value.trim();
            const scoreVal = parseFloat(inputScore.value);
            const ok = addPlayer(idVal, nameVal, scoreVal);
            if (ok) {
                inputId.value = '';
                inputName.value = '';
                inputScore.value = '';
                inputId.focus();
            }
        });

        inputId.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault();
                inputName.focus(); }
        });
        inputName.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault();
                inputScore.focus(); }
        });
        inputScore.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault();
                btnAdd.click(); }
        });

        modalCancel.addEventListener('click', closeModal);
        modalSave.addEventListener('click', handleModalSave);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        modalId.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault();
                modalName.focus(); }
        });
        modalName.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault();
                modalScore.focus(); }
        });
        modalScore.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault();
                handleModalSave(); }
            if (e.key === 'Escape') { closeModal(); }
        });

        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (players.length > 0) {
                    updateScrollHeight();
                    scrollToRow(currentScrollRow);
                    const total = getTotalRows();
                    const visible = getVisibleRows();
                    if (total > visible && total > 1 && isScrolling) {
                        startScroll();
                    } else if (total <= visible || total <= 1) {
                        stopScroll();
                    }
                }
            }, 300);
        });

        // ================================================================
        //  INIT
        // ================================================================
        loadData();
        render();

        setTimeout(() => {
            const total = getTotalRows();
            const visible = getVisibleRows();
            if (total > visible && total > 1) {
                startScroll();
            } else {
                isScrolling = false;
                updateScrollBtnState();
            }
        }, 400);

        inputId.focus();

        console.log('♠ KK德州酒馆荣誉排行榜已加载！');
        console.log(`📊 当前 ${players.length} 位玩家`);
        console.log('🔄 自动滚屏已启用，鼠标悬停暂停');
    </script>

</body>
</html>
